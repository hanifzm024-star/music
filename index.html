<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Music Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0f0c1a 0%, #1a142b 30%, #0d1f2d 70%, #0a1520 100%);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .player-container {
            max-width: 480px;
            width: 100%;
            background: rgba(18, 18, 30, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            padding: 24px 20px 28px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.9);
        }

        /* HEADER */
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .player-header h2 {
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .player-header .badge {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 400;
        }

        /* COVER */
        .art-cover {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 20px;
            background: linear-gradient(135deg, #2d2a3e, #1a1628);
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.7);
        }

        .art-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .art-cover .fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            color: rgba(255, 255, 255, 0.06);
            background: radial-gradient(circle at 30% 30%, #3a3550, #14101f);
        }

        /* SONG INFO */
        .song-info {
            margin-bottom: 16px;
        }

        .song-title {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
            line-height: 1.3;
        }

        .song-artist {
            font-size: 16px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.55);
            margin-top: 2px;
        }

        /* PROGRESS */
        .progress-section {
            margin-bottom: 16px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            transition: height 0.15s;
        }

        .progress-bar:hover {
            height: 6px;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #f7b731, #f5a623);
            border-radius: 4px;
            transition: width 0.1s linear;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 12px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.3);
        }

        /* CONTROLS */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 8px;
            margin-bottom: 22px;
        }

        .controls button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 18px;
            cursor: pointer;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .controls button:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .controls .play-btn {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #f7b731, #f5a623);
            color: #0b0b0e;
            font-size: 24px;
            border-radius: 50%;
            box-shadow: 0 8px 28px rgba(247, 183, 49, 0.25);
            transition: all 0.25s ease;
        }

        .controls .play-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 12px 36px rgba(247, 183, 49, 0.35);
            background: linear-gradient(135deg, #fcc44a, #f5a623);
        }

        .controls .play-btn i {
            margin-left: 3px;
        }

        /* PLAYLIST */
        .playlist-section {
            margin-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 16px;
            max-height: 260px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.06) transparent;
        }

        .playlist-section::-webkit-scrollbar {
            width: 4px;
        }

        .playlist-section::-webkit-scrollbar-track {
            background: transparent;
        }

        .playlist-section::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 2px;
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .playlist-item.active {
            background: rgba(247, 183, 49, 0.08);
        }

        .playlist-item .index {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.2);
            width: 22px;
            text-align: center;
            flex-shrink: 0;
        }

        .playlist-item .info {
            flex: 1;
            min-width: 0;
        }

        .playlist-item .info .pl-title {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item .info .pl-artist {
            font-size: 12px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.35);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item .play-indicator {
            font-size: 12px;
            color: #f7b731;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .playlist-item.active .play-indicator {
            opacity: 1;
        }

        /* responsive */
        @media (max-width: 480px) {
            .player-container {
                padding: 18px 14px 20px;
                border-radius: 24px;
            }
            .song-title {
                font-size: 19px;
            }
            .controls {
                gap: 12px;
            }
            .controls .play-btn {
                width: 52px;
                height: 52px;
                font-size: 20px;
            }
            .playlist-section {
                max-height: 200px;
            }
        }
    </style>
</head>
<body>

    <div class="player-container">

        <!-- HEADER -->
        <div class="player-header">
            <h2><i class="fas fa-headphones" style="margin-right:8px;color:#f7b731;font-size:16px;"></i> Pemutar</h2>
            <span class="badge"><span id="totalSongs">20</span> lagu</span>
        </div>

        <!-- COVER -->
        <div class="art-cover" id="artCover">
            <img id="coverImg" src="" alt="Cover" style="display:none;" />
            <div class="fallback" id="fallbackCover">
                <i class="fas fa-music"></i>
            </div>
        </div>

        <!-- SONG INFO -->
        <div class="song-info">
            <div class="song-title" id="songTitle">Pilih lagu</div>
            <div class="song-artist" id="songArtist">—</div>
        </div>

        <!-- PROGRESS -->
        <div class="progress-section">
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="time-row">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>
        </div>

        <!-- CONTROLS -->
        <div class="controls">
            <button id="shuffleBtn" title="Shuffle"><i class="fas fa-random"></i></button>
            <button id="prevBtn" title="Previous"><i class="fas fa-step-backward"></i></button>
            <button class="play-btn" id="playBtn" title="Play / Pause">
                <i class="fas fa-play" id="playIcon"></i>
            </button>
            <button id="nextBtn" title="Next"><i class="fas fa-step-forward"></i></button>
            <button id="repeatBtn" title="Repeat"><i class="fas fa-redo-alt"></i></button>
        </div>

        <!-- PLAYLIST -->
        <div class="playlist-section" id="playlistContainer"></div>

    </div>

    <script>
        // ============================================================
        // DATA LAGU (dari yang diberikan)
        // ============================================================
        const songData = [{
            artist: "Ariana Grande",
            title: "Position",
            src: "assets/ariana-grande-positions.mp3"
        }, {
            artist: "Hindia",
            title: "Membasuh",
            src: "assets/hindia-membasuh.mp3"
        }, {
            artist: "Armada",
            title: "Mau Dibawa Kemana",
            src: "assets/mau-dibawa-kemana-armada.mp3"
        }, {
            artist: "Kahitna",
            title: "Titik Nadir",
            src: "assets/KAHITNA-Titik Nadir.mp3"
        }, {
            artist: "Kahitna",
            title: "Mantan Terindah",
            src: "assets/KAHITNA-MANTAN TERINDAH.mp3"
        }, {
            artist: "Marcell",
            title: "Firasat",
            src: "assets/MARCELL-Firasat.mp3"
        }, {
            artist: "Acha & Irwansyah",
            title: "My Heart",
            src: "assets/ACHA SEPTRIASA - IRWANSYAH-My Heart.mp3"
        }, {
            artist: "Hello",
            title: "Ular Berbisa",
            src: "assets/Hello - Ular Berbisa.mp3"
        }, {
            artist: "Rossa",
            title: "Tak Sanggup Lagi",
            src: "assets/Rossa - Tak Sanggup Lagi.mp3"
        }, {
            artist: "Raim Laode",
            title: "Bersenja Gurau",
            src: "assets/Bersenja Gurau - Raim Laode.mp3"
        }, {
            artist: "Sheila On 7",
            title: "Kita",
            src: "assets/Sheila On 7 - Kita.mp3"
        }, {
            artist: "Raim Laode",
            title: "Iqro'",
            src: "assets/Raim Laode - Iqro'.mp3"
        }, {
            artist: "Sheila On 7",
            title: "Dan",
            src: "assets/Sheila On 7 - Dan.mp3"
        }, {
            artist: "Sheila On 7",
            title: "Itu Aku",
            src: "assets/Sheila On 7 - Itu Aku.mp3"
        }, {
            artist: "NUCA",
            title: "MASA INI, NANTI, DAN MASA INDAH LAINNYA",
            src: "assets/NUCA - MASA INI, NANTI, DAN MASA INDAH LAINNYA.mp3"
        }, {
            artist: "Astrid",
            title: "Terpukau",
            src: "assets/Astrid - Terpukau.mp3"
        }, {
            artist: "Pamungkas",
            title: "Berapa Kali Kita Akan Saling Memaafkan",
            src: "assets/Pamungkas - Berapa Kali Kita Akan Saling Memaafkan.mp3"
        }, {
            artist: "Nadhif Basalamah",
            title: "kota ini tak sama tanpamu",
            src: "assets/Nadhif Basalamah - kota ini tak sama tanpamu.mp3"
        }, {
            artist: "Nadhif Basalamah",
            title: "bergema sampai selamanya",
            src: "assets/Nadhif Basalamah - bergema sampai selamanya.mp3"
        }, {
            artist: "ANDMESH",
            title: "ANUGERAH TERINDAH",
            src: "assets/ANDMESH - ANUGERAH TERINDAH.mp3"
        }];

        // ============================================================
        // DOM REFS
        // ============================================================
        const audio = new Audio();
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const progressBar = document.getElementById('progressBar');
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');
        const coverImg = document.getElementById('coverImg');
        const fallbackCover = document.getElementById('fallbackCover');
        const playlistContainer = document.getElementById('playlistContainer');
        const totalSongs = document.getElementById('totalSongs');

        let currentIndex = 0;
        let isPlaying = false;
        let isShuffle = false;
        let isRepeat = false;

        // ============================================================
        // FUNGSI UTAMA
        // ============================================================

        // Muat lagu berdasarkan index
        function loadSong(index) {
            const song = songData[index];
            if (!song) return;

            audio.src = song.src;
            songTitle.textContent = song.title;
            songArtist.textContent = song.artist;

            // Cover – coba pakai gambar dari picsum dengan seed berdasarkan title
            const seed = encodeURIComponent(song.title + ' ' + song.artist);
            coverImg.src = `https://picsum.photos/seed/${seed}/400/400`;
            coverImg.style.display = 'block';
            fallbackCover.style.display = 'none';

            // Fallback jika gambar gagal
            coverImg.onerror = function() {
                coverImg.style.display = 'none';
                fallbackCover.style.display = 'flex';
            };

            // Reset progress
            progressFill.style.width = '0%';
            currentTimeEl.textContent = '0:00';
            totalTimeEl.textContent = '0:00';

            // Highlight playlist
            document.querySelectorAll('.playlist-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            // Auto-play jika sedang playing
            if (isPlaying) {
                audio.play().catch(() => {});
            }
        }

        // Format detik ke MM:SS
        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === Infinity) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        // Update progress & waktu
        function updateProgress() {
            if (audio.duration && !isNaN(audio.duration)) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = percent + '%';
                currentTimeEl.textContent = formatTime(audio.currentTime);
                totalTimeEl.textContent = formatTime(audio.duration);
            }
        }

        // ============================================================
        // KONTROL
        // ============================================================

        function togglePlay() {
            if (audio.src === '' || !audio.src) {
                // jika belum ada lagu, load index 0
                currentIndex = 0;
                loadSong(currentIndex);
            }

            if (isPlaying) {
                audio.pause();
                playIcon.className = 'fas fa-play';
            } else {
                audio.play().catch(() => {});
                playIcon.className = 'fas fa-pause';
            }
            isPlaying = !isPlaying;
        }

        function nextSong() {
            if (songData.length === 0) return;
            if (isShuffle) {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * songData.length);
                } while (newIndex === currentIndex && songData.length > 1);
                currentIndex = newIndex;
            } else {
                currentIndex = (currentIndex + 1) % songData.length;
            }
            loadSong(currentIndex);
            if (isPlaying) {
                audio.play().catch(() => {});
                playIcon.className = 'fas fa-pause';
            }
        }

        function prevSong() {
            if (songData.length === 0) return;
            if (audio.currentTime > 3) {
                audio.currentTime = 0;
                return;
            }
            currentIndex = (currentIndex - 1 + songData.length) % songData.length;
            loadSong(currentIndex);
            if (isPlaying) {
                audio.play().catch(() => {});
                playIcon.className = 'fas fa-pause';
            }
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================

        // Tombol
        playBtn.addEventListener('click', togglePlay);

        document.getElementById('nextBtn').addEventListener('click', nextSong);

        document.getElementById('prevBtn').addEventListener('click', prevSong);

        document.getElementById('shuffleBtn').addEventListener('click', function() {
            isShuffle = !isShuffle;
            this.style.color = isShuffle ? '#f7b731' : '';
        });

        document.getElementById('repeatBtn').addEventListener('click', function() {
            isRepeat = !isRepeat;
            this.style.color = isRepeat ? '#f7b731' : '';
            audio.loop = isRepeat;
        });

        // Klik progress bar
        progressBar.addEventListener('click', function(e) {
            const rect = this.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const width = rect.width;
            if (audio.duration) {
                audio.currentTime = (x / width) * audio.duration;
            }
        });

        // Audio events
        audio.addEventListener('timeupdate', updateProgress);

        audio.addEventListener('loadedmetadata', function() {
            totalTimeEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('ended', function() {
            if (isRepeat) {
                audio.currentTime = 0;
                audio.play().catch(() => {});
            } else {
                playIcon.className = 'fas fa-play';
                isPlaying = false;
                nextSong();
            }
        });

        // ============================================================
        // RENDER PLAYLIST
        // ============================================================

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            songData.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = 'playlist-item' + (index === currentIndex ? ' active' : '');
                item.innerHTML = `
                    <span class="index">${index + 1}</span>
                    <div class="info">
                        <div class="pl-title">${song.title}</div>
                        <div class="pl-artist">${song.artist}</div>
                    </div>
                    <span class="play-indicator"><i class="fas fa-play"></i></span>
                `;
                item.addEventListener('click', function() {
                    currentIndex = index;
                    loadSong(currentIndex);
                    if (isPlaying) {
                        audio.play().catch(() => {});
                        playIcon.className = 'fas fa-pause';
                    } else {
                        togglePlay(); // otomatis play
                    }
                });
                playlistContainer.appendChild(item);
            });
            totalSongs.textContent = songData.length;
        }

        // ============================================================
        // INISIALISASI
        // ============================================================

        renderPlaylist();
        // Muat lagu pertama
        currentIndex = 0;
        loadSong(currentIndex);

        // Tampilkan cover awal dengan fallback sampai gambar dimuat
        coverImg.style.display = 'none';
        fallbackCover.style.display = 'flex';

        console.log('🎵 Player siap dengan ' + songData.length + ' lagu!');
    </script>

</body>
</html>
