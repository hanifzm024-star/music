<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glassmorphism Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        /* ===== CSS Variables ===== */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.10);
            --glass-border: rgba(255, 255, 255, 0.20);
            --glass-shadow: rgba(0, 0, 0, 0.35);
            --glass-blur: 18px;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.75);
            --text-muted: rgba(255, 255, 255, 0.45);
            --accent: #f7c948;
            --accent-glow: rgba(247, 201, 72, 0.25);
            --card-radius: 20px;
            --pill-radius: 60px;
            --transition-smooth: 0.55s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* ===== Reset & Base ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #1a0a0a;
            padding: 16px;
        }

        /* ===== Background ===== */
        .app {
            position: relative;
            width: 100%;
            max-width: 1100px;
            height: 92vh;
            max-height: 820px;
            border-radius: 40px;
            overflow: hidden;
            background: radial-gradient(ellipse at 20% 30%, #b31b1b 0%, #7a1414 30%, #2d0a0a 65%, #0d0505 100%);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 28px 28px 24px 28px;
        }

        .app::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 40px;
            background: radial-gradient(ellipse at 70% 10%, #f7c948 0%, transparent 50%),
                radial-gradient(ellipse at 30% 90%, #b31b1b 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, #4a0f0f 0%, transparent 70%);
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
        }

        .app>* {
            position: relative;
            z-index: 1;
        }

        /* ===== Carousel Wrapper ===== */
        .carousel-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            padding: 0 12px;
        }

        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 780px;
            height: 100%;
            max-height: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
        }

        /* ===== Carousel Track ===== */
        .carousel-track {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* ===== Card ===== */
        .card {
            flex: 0 0 0;
            width: 200px;
            min-width: 140px;
            max-width: 260px;
            height: 85%;
            max-height: 340px;
            border-radius: var(--card-radius);
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            box-shadow: 0 12px 40px var(--glass-shadow);
            overflow: hidden;
            transition: all var(--transition-smooth);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
            opacity: 0.5;
            transform: scale(0.78) perspective(800px) rotateY(18deg) translateZ(-40px);
            pointer-events: none;
            user-select: none;
        }

        .card .card-img {
            width: 100%;
            aspect-ratio: 1/1;
            background: #1a0a0a;
            overflow: hidden;
            flex-shrink: 0;
        }

        .card .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .card .card-body {
            padding: 10px 14px 12px;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 64px;
        }

        .card .card-body .artist {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-secondary);
            opacity: 0.7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card .card-body .title {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 1px;
        }

        /* -- Active Card (Center) -- */
        .card.active {
            flex: 0 0 280px;
            width: 280px;
            min-width: 200px;
            max-width: 320px;
            height: 100%;
            max-height: 400px;
            opacity: 1;
            transform: scale(1) perspective(800px) rotateY(0) translateZ(0);
            pointer-events: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), 0 0 40px var(--accent-glow);
            border-color: rgba(255, 255, 255, 0.30);
        }

        .card.active .card-body .artist {
            opacity: 1;
            color: var(--accent);
        }

        .card.active .card-body .title {
            font-size: 0.95rem;
        }

        /* -- Left Card -- */
        .card.left {
            opacity: 0.6;
            transform: scale(0.78) perspective(800px) rotateY(22deg) translateX(-20px) translateZ(-50px);
            pointer-events: none;
        }

        /* -- Right Card -- */
        .card.right {
            opacity: 0.6;
            transform: scale(0.78) perspective(800px) rotateY(-22deg) translateX(20px) translateZ(-50px);
            pointer-events: none;
        }

        /* -- Hidden cards (further out) -- */
        .card.hidden-left {
            opacity: 0;
            transform: scale(0.6) perspective(800px) rotateY(40deg) translateX(-120px) translateZ(-100px);
            pointer-events: none;
            width: 0;
            min-width: 0;
            padding: 0;
            margin: 0;
            overflow: hidden;
            flex: 0 0 0;
            border: 0;
        }

        .card.hidden-right {
            opacity: 0;
            transform: scale(0.6) perspective(800px) rotateY(-40deg) translateX(120px) translateZ(-100px);
            pointer-events: none;
            width: 0;
            min-width: 0;
            padding: 0;
            margin: 0;
            overflow: hidden;
            flex: 0 0 0;
            border: 0;
        }

        /* ===== Carousel Nav Buttons ===== */
        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: var(--text-primary);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .carousel-nav:hover {
            background: rgba(255, 255, 255, 0.20);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-50%) scale(1.06);
        }

        .carousel-nav:active {
            transform: translateY(-50%) scale(0.94);
        }

        .carousel-nav.prev {
            left: -12px;
        }

        .carousel-nav.next {
            right: -12px;
        }

        @media (min-width: 768px) {
            .carousel-nav.prev {
                left: -20px;
            }
            .carousel-nav.next {
                right: -20px;
            }
        }

        /* ===== Bottom Player Bar ===== */
        .player-bar {
            flex-shrink: 0;
            padding: 6px 6px 6px 18px;
            border-radius: var(--pill-radius);
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 72px;
            margin-top: 12px;
        }

        /* -- Left Controls -- */
        .player-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .player-controls button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .player-controls button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }

        .player-controls button.play-btn {
            width: 48px;
            height: 48px;
            background: var(--accent);
            color: #1a0a0a;
            font-size: 1.2rem;
            box-shadow: 0 4px 20px rgba(247, 201, 72, 0.35);
        }

        .player-controls button.play-btn:hover {
            background: #f5d96a;
            transform: scale(1.04);
            box-shadow: 0 6px 28px rgba(247, 201, 72, 0.45);
        }

        .player-controls button.play-btn:active {
            transform: scale(0.94);
        }

        /* -- Center: Song Info + Progress -- */
        .player-info {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            padding: 0 6px;
        }

        .player-info .thumb {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
            background: #1a0a0a;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .player-info .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .player-info .meta {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .player-info .meta .p-artist {
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-info .meta .p-title {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-info .meta .p-progress {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 2px;
            width: 100%;
            max-width: 200px;
        }

        .player-info .meta .p-progress .bar {
            flex: 1;
            height: 3px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.15);
            overflow: hidden;
            cursor: pointer;
            position: relative;
            min-width: 40px;
        }

        .player-info .meta .p-progress .bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), #f5d96a);
            border-radius: 4px;
            transition: width 0.08s linear;
        }

        .player-info .meta .p-progress .time {
            font-size: 0.55rem;
            font-weight: 500;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.02em;
            white-space: nowrap;
            min-width: 32px;
        }

        /* -- Right: Extra Icons -- */
        .player-extras {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
            padding-right: 4px;
        }

        .player-extras button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .player-extras button:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
        }

        /* ===== Waveform animation ===== */
        .waveform {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 20px;
            margin-left: 4px;
            flex-shrink: 0;
        }

        .waveform .bar {
            width: 3px;
            background: var(--accent);
            border-radius: 3px;
            transition: height 0.2s ease;
            height: 6px;
        }

        .waveform.playing .bar {
            animation: wave 0.6s ease-in-out infinite alternate;
        }

        .waveform.playing .bar:nth-child(1) {
            animation-delay: 0.0s;
            height: 10px;
        }
        .waveform.playing .bar:nth-child(2) {
            animation-delay: 0.1s;
            height: 16px;
        }
        .waveform.playing .bar:nth-child(3) {
            animation-delay: 0.2s;
            height: 22px;
        }
        .waveform.playing .bar:nth-child(4) {
            animation-delay: 0.3s;
            height: 14px;
        }
        .waveform.playing .bar:nth-child(5) {
            animation-delay: 0.15s;
            height: 18px;
        }
        .waveform.playing .bar:nth-child(6) {
            animation-delay: 0.25s;
            height: 12px;
        }
        .waveform.playing .bar:nth-child(7) {
            animation-delay: 0.05s;
            height: 20px;
        }
        .waveform.playing .bar:nth-child(8) {
            animation-delay: 0.35s;
            height: 8px;
        }

        @keyframes wave {
            0% {
                transform: scaleY(0.4);
            }
            100% {
                transform: scaleY(1);
            }
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .app {
                height: 96vh;
                max-height: none;
                border-radius: 28px;
                padding: 16px 14px 14px 14px;
            }

            .carousel-container {
                max-height: 300px;
            }

            .card {
                width: 130px;
                min-width: 90px;
                max-width: 170px;
                height: 75%;
                max-height: 240px;
                transform: scale(0.7) perspective(600px) rotateY(16deg) translateZ(-30px);
            }

            .card.active {
                flex: 0 0 180px;
                width: 180px;
                min-width: 140px;
                max-width: 220px;
                height: 90%;
                max-height: 290px;
            }

            .card.left {
                transform: scale(0.7) perspective(600px) rotateY(20deg) translateX(-12px) translateZ(-35px);
            }
            .card.right {
                transform: scale(0.7) perspective(600px) rotateY(-20deg) translateX(12px) translateZ(-35px);
            }

            .card .card-body {
                padding: 6px 10px 10px;
                min-height: 48px;
            }
            .card .card-body .artist {
                font-size: 0.5rem;
            }
            .card .card-body .title {
                font-size: 0.65rem;
            }
            .card.active .card-body .title {
                font-size: 0.78rem;
            }

            .carousel-nav {
                width: 34px;
                height: 34px;
                font-size: 0.8rem;
            }
            .carousel-nav.prev {
                left: -6px;
            }
            .carousel-nav.next {
                right: -6px;
            }

            .player-bar {
                padding: 4px 4px 4px 12px;
                min-height: 60px;
                gap: 8px;
                border-radius: 36px;
            }

            .player-controls button {
                width: 32px;
                height: 32px;
                font-size: 0.9rem;
            }
            .player-controls button.play-btn {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            .player-info .thumb {
                width: 36px;
                height: 36px;
                border-radius: 8px;
            }
            .player-info .meta .p-artist {
                font-size: 0.5rem;
            }
            .player-info .meta .p-title {
                font-size: 0.65rem;
            }
            .player-info .meta .p-progress .bar {
                min-width: 24px;
            }
            .player-info .meta .p-progress .time {
                font-size: 0.45rem;
                min-width: 24px;
            }

            .player-extras button {
                width: 30px;
                height: 30px;
                font-size: 0.8rem;
            }

            .waveform {
                height: 16px;
                gap: 1.5px;
            }
            .waveform .bar {
                width: 2.5px;
            }
            .waveform.playing .bar:nth-child(1) {
                height: 8px;
            }
            .waveform.playing .bar:nth-child(2) {
                height: 12px;
            }
            .waveform.playing .bar:nth-child(3) {
                height: 18px;
            }
            .waveform.playing .bar:nth-child(4) {
                height: 10px;
            }
            .waveform.playing .bar:nth-child(5) {
                height: 14px;
            }
            .waveform.playing .bar:nth-child(6) {
                height: 8px;
            }
            .waveform.playing .bar:nth-child(7) {
                height: 16px;
            }
            .waveform.playing .bar:nth-child(8) {
                height: 6px;
            }
        }

        @media (max-width: 480px) {
            .app {
                padding: 10px 8px 10px 8px;
                border-radius: 20px;
            }
            .carousel-container {
                max-height: 220px;
            }
            .card {
                width: 90px;
                min-width: 70px;
                max-width: 120px;
                height: 65%;
                max-height: 170px;
                border-radius: 14px;
            }
            .card.active {
                flex: 0 0 130px;
                width: 130px;
                min-width: 100px;
                max-width: 160px;
                height: 85%;
                max-height: 210px;
            }
            .card .card-body {
                padding: 4px 8px 8px;
                min-height: 38px;
            }
            .card .card-body .artist {
                font-size: 0.4rem;
            }
            .card .card-body .title {
                font-size: 0.5rem;
            }
            .card.active .card-body .title {
                font-size: 0.6rem;
            }
            .carousel-nav {
                width: 28px;
                height: 28px;
                font-size: 0.65rem;
            }
            .carousel-nav.prev {
                left: -4px;
            }
            .carousel-nav.next {
                right: -4px;
            }
            .player-bar {
                padding: 3px 3px 3px 8px;
                min-height: 50px;
                gap: 4px;
                border-radius: 28px;
            }
            .player-controls button {
                width: 28px;
                height: 28px;
                font-size: 0.75rem;
            }
            .player-controls button.play-btn {
                width: 34px;
                height: 34px;
                font-size: 0.85rem;
            }
            .player-info .thumb {
                width: 30px;
                height: 30px;
                border-radius: 6px;
            }
            .player-info .meta .p-artist {
                font-size: 0.45rem;
            }
            .player-info .meta .p-title {
                font-size: 0.55rem;
            }
            .player-info .meta .p-progress {
                max-width: 100px;
            }
            .player-info .meta .p-progress .bar {
                min-width: 16px;
            }
            .player-info .meta .p-progress .time {
                font-size: 0.4rem;
                min-width: 18px;
            }
            .player-extras button {
                width: 26px;
                height: 26px;
                font-size: 0.7rem;
            }
            .waveform {
                height: 14px;
                gap: 1px;
            }
            .waveform .bar {
                width: 2px;
            }
            .waveform.playing .bar:nth-child(1) {
                height: 6px;
            }
            .waveform.playing .bar:nth-child(2) {
                height: 10px;
            }
            .waveform.playing .bar:nth-child(3) {
                height: 14px;
            }
            .waveform.playing .bar:nth-child(4) {
                height: 8px;
            }
            .waveform.playing .bar:nth-child(5) {
                height: 12px;
            }
            .waveform.playing .bar:nth-child(6) {
                height: 6px;
            }
            .waveform.playing .bar:nth-child(7) {
                height: 14px;
            }
            .waveform.playing .bar:nth-child(8) {
                height: 4px;
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- ===== CAROUSEL ===== -->
        <div class="carousel-wrapper">
            <div class="carousel-container">
                <button class="carousel-nav prev" id="carouselPrev" aria-label="Previous">
                    <i class="fas fa-chevron-left"></i>
                </button>

                <div class="carousel-track" id="carouselTrack"></div>

                <button class="carousel-nav next" id="carouselNext" aria-label="Next">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>

        <!-- ===== BOTTOM PLAYER BAR ===== -->
        <div class="player-bar">

            <!-- Left: Controls -->
            <div class="player-controls">
                <button id="btnPrev" aria-label="Previous">
                    <i class="fas fa-backward"></i>
                </button>
                <button class="play-btn" id="btnPlay" aria-label="Play / Pause">
                    <i class="fas fa-play" id="playIcon"></i>
                </button>
                <button id="btnNext" aria-label="Next">
                    <i class="fas fa-forward"></i>
                </button>
            </div>

            <!-- Center: Info + Progress -->
            <div class="player-info">
                <div class="thumb" id="playerThumb">
                    <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=120&h=120&fit=crop&crop=center" alt="cover" />
                </div>
                <div class="meta">
                    <span class="p-artist" id="playerArtist">—</span>
                    <span class="p-title" id="playerTitle">—</span>
                    <div class="p-progress">
                        <div class="bar" id="progressBar">
                            <div class="fill" id="progressFill"></div>
                        </div>
                        <span class="time" id="progressTime">0:00</span>
                    </div>
                </div>
                <div class="waveform" id="waveform">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
            </div>

            <!-- Right: Extras -->

        }, {
            artist: "ANDMESH",
            title: "ANUGERAH TERINDAH",
            src: "assets/ANDMESH - ANUGERAH TERINDAH.mp3",
            cover: "https://i.scdn.co/image/ab67616d00001e02e2fc4fcab619222ecdaa7d74"
        }, {
            artist: "Al Ghazali ft. Chelsea Shania",
            title: "Kesayanganku OST. Samudra Cinta",
            src: "assets/Al Ghazali ft. Chelsea Shania - Kesayanganku OST. Samudra Cinta.mp3",
            cover: "https://i.scdn.co/image/ab67616d0000b27310c6e64061a6e21801541402"
        }, {
            artist: "Cakra Khan feat Siti Nurhaliza",
            title: "Seluruh Cinta",
            src: "assets/Cakra Khan feat Siti Nurhaliza - Seluruh Cinta.mp3",
            cover: "https://i.scdn.co/image/ab67616d0000b273d33c6cc87f8dbad9130c985a"
        }, {
            artist: "Agnes Monica",
            title: "Matahariku",
            src: "assets/Agnes Monica - Matahariku.mp3",
            cover: "https://i.scdn.co/image/14b0710e72613cdda880302cd615d2ff8ac87812"
        }, {
            artist: "Maudy Ayunda",
            title: "Kamu Dan Kenangan",
            src: "assets/Maudy Ayunda - Kamu Dan Kenangan.mp3",
            cover: "https://i.scdn.co/image/ab67616d0000b273bc1e873a4ac4d86f563680a0"
        }, {
            artist: "Ari Lesmana",
            title: "Sesi Potret",
            src: "assets/Ari Lesmana - Sesi Potret.mp3",
            cover: "https://i.scdn.co/image/ab67616d0000b273172768978c7f929803ad7e8b"
        }, {
            artist: "ANDMESH",
            title: "ANDAIKAN KAU DATANG",
            src: "assets/ANDMESH - ANDAIKAN KAU DATANG.mp3",
            cover: "https://i.scdn.co/image/ab67616d00001e02e2fc4fcab619222ecdaa7d74"
        }];

        // ============================================================
        // STATE
        // ============================================================
        let currentIndex = 0;
        let isPlaying = false;
        let audio = new Audio();
        let currentSong = null;

        // DOM refs
        const track = document.getElementById('carouselTrack');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const btnPlay = document.getElementById('btnPlay');
        const playIcon = document.getElementById('playIcon');
        const playerArtist = document.getElementById('playerArtist');
        const playerTitle = document.getElementById('playerTitle');
        const playerThumb = document.getElementById('playerThumb').querySelector('img');
        const progressFill = document.getElementById('progressFill');
        const progressTime = document.getElementById('progressTime');
        const progressBar = document.getElementById('progressBar');
        const waveform = document.getElementById('waveform');
        const carouselPrev = document.getElementById('carouselPrev');
        const carouselNext = document.getElementById('carouselNext');

        // ============================================================
        // RENDER CAROUSEL
        // ============================================================
        function renderCarousel(centerIdx) {
            const total = songData.length;
            const cards = [];

            for (let i = 0; i < total; i++) {
                const diff = i - centerIdx;
                let className = 'card';

                if (diff === 0) className += ' active';
                else if (diff === -1) className += ' left';
                else if (diff === 1) className += ' right';
                else if (diff < -1) className += ' hidden-left';
                else if (diff > 1) className += ' hidden-right';

                const song = songData[i];
                const coverUrl = song.cover ||
                    'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400&h=400&fit=crop&crop=center';

                cards.push(`
                    <div class="${className}" data-index="${i}">
                        <div class="card-img">
                            <img src="${coverUrl}" alt="${song.artist} - ${song.title}" loading="lazy" />
                        </div>
                        <div class="card-body">
                            <span class="artist">${song.artist}</span>
                            <span class="title">${song.title}</span>
                        </div>
                    </div>
                `);
            }

            track.innerHTML = cards.join('');

            // Click on card to jump
            track.querySelectorAll('.card').forEach((el) => {
                const idx = parseInt(el.dataset.index, 10);
                el.addEventListener('click', () => {
                    if (idx !== currentIndex) {
                        currentIndex = idx;
                        renderCarousel(currentIndex);
                        loadSong(currentIndex);
                    }
                });
            });
        }

        // ============================================================
        // AUDIO PLAYER
        // ============================================================
        function loadSong(index) {
            const song = songData[index];
            if (!song) return;
            currentSong = song;

            audio.pause();
            audio.src = song.src;
            audio.load();

            playerArtist.textContent = song.artist;
            playerTitle.textContent = song.title;
            const cover = song.cover ||
                'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=120&h=120&fit=crop&crop=center';
            playerThumb.src = cover;

            progressFill.style.width = '0%';
            progressTime.textContent = '0:00';

            // Update active card in carousel
            if (currentIndex !== index) {
                currentIndex = index;
                renderCarousel(currentIndex);
            } else {
                renderCarousel(currentIndex);
            }

            if (isPlaying) {
                audio.play().catch(() => {});
            }
        }

        function togglePlay() {
            if (!currentSong) {
                loadSong(currentIndex);
                return;
            }

            if (isPlaying) {
                audio.pause();
            } else {
                audio.play().catch(() => {});
            }
        }

        function prevSong() {
            const prev = (currentIndex - 1 + songData.length) % songData.length;
            currentIndex = prev;
            loadSong(prev);
            if (isPlaying) {
                audio.play().catch(() => {});
            }
        }

        function nextSong() {
            const next = (currentIndex + 1) % songData.length;
            currentIndex = next;
            loadSong(next);
            if (isPlaying) {
                audio.play().catch(() => {});
            }
        }

        // ============================================================
        // UI UPDATE
        // ============================================================
        function updatePlayButton() {
            if (isPlaying) {
                playIcon.className = 'fas fa-pause';
                waveform.classList.add('playing');
            } else {
                playIcon.className = 'fas fa-play';
                waveform.classList.remove('playing');
            }
        }

        function updateProgress() {
            if (!audio.duration) return;
            const pct = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = pct + '%';

            const m = Math.floor(audio.currentTime / 60);
            const s = Math.floor(audio.currentTime % 60);
            progressTime.textContent = m + ':' + (s < 10 ? '0' : '') + s;
        }

        // ============================================================
        // EVENT BINDING
        // ============================================================
        // Play / Pause
        btnPlay.addEventListener('click', togglePlay);

        // Prev / Next
        btnPrev.addEventListener('click', prevSong);
        btnNext.addEventListener('click', nextSong);
        carouselPrev.addEventListener('click', prevSong);
        carouselNext.addEventListener('click', nextSong);

        // Audio events
        audio.addEventListener('play', () => {
            isPlaying = true;
            updatePlayButton();
        });

        audio.addEventListener('pause', () => {
            isPlaying = false;
            updatePlayButton();
        });

        audio.addEventListener('ended', () => {
            isPlaying = false;
            updatePlayButton();
            nextSong();
        });

        audio.addEventListener('timeupdate', updateProgress);

        // Click on progress bar to seek
        progressBar.addEventListener('click', (e) => {
            if (!audio.duration) return;
            const rect = progressBar.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            audio.currentTime = x * audio.duration;
        });

        // Keyboard shortcuts (space = play/pause)
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            }
            if (e.code === 'ArrowRight') {
                e.preventDefault();
                nextSong();
            }
            if (e.code === 'ArrowLeft') {
                e.preventDefault();
                prevSong();
            }
        });

        // ============================================================
        // INIT
        // ============================================================
        renderCarousel(0);
        loadSong(0);
        updatePlayButton();

        // If audio fails to load, fallback gracefully
        audio.addEventListener('error', () => {
            // silent fallback
        });

        console.log('🎵 Glassmorphism Music Player ready.');
    </script>
