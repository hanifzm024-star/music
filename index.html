<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music App - 3 Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        /* ===== 3-PANEL WRAPPER ===== */
        .app-wrapper {
            display: grid;
            grid-template-columns: 320px 1fr 340px;
            gap: 18px;
            max-width: 1300px;
            width: 100%;
            min-height: 720px;
            background: #0f0f0f;
            border-radius: 32px;
            padding: 18px 18px 18px 18px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px #2a2a2a inset;
            transition: all 0.2s;
        }

        /* ===== PANEL BASE ===== */
        .panel {
            background: #111;
            border-radius: 24px;
            padding: 16px 16px 14px 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 680px;
        }
        .panel-scroll {
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
        }
        .panel-scroll::-webkit-scrollbar {
            width: 3px;
        }
        .panel-scroll::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 10px;
        }
        .panel-scroll::-webkit-scrollbar-thumb {
            background: #ff6b6b;
            border-radius: 10px;
        }

        /* ===== PANEL LEFT — ALBUM LIST ===== */
        .panel-left .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .panel-left .panel-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }
        .panel-left .panel-header .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
            overflow: hidden;
            flex-shrink: 0;
        }
        .panel-left .panel-header .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .panel-left .search-bar {
            background: #1e1e1e;
            border-radius: 30px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            border: 1px solid #2a2a2a;
            transition: border 0.2s;
        }
        .panel-left .search-bar:focus-within {
            border-color: #ff6b6b;
        }
        .panel-left .search-bar i {
            color: #666;
            font-size: 13px;
        }
        .panel-left .search-bar input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            width: 100%;
        }
        .panel-left .search-bar input::placeholder {
            color: #555;
            font-weight: 300;
        }

        .panel-left .section-label {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            margin: 10px 0 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel-left .section-label a {
            font-size: 11px;
            color: #ff6b6b;
            text-decoration: none;
            font-weight: 500;
        }

        /* song cards in left panel */
        .song-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 2px;
        }
        .song-card:hover {
            background: #1a1a1a;
        }
        .song-card .cover {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
            background: #1a1a1a;
        }
        .song-card .info {
            flex: 1;
            min-width: 0;
        }
        .song-card .info .title {
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-card .info .artist {
            font-size: 11px;
            color: #9a9a9a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-card .badge {
            font-size: 10px;
            color: #666;
            flex-shrink: 0;
        }
        .song-card .play-indicator {
            color: #ff6b6b;
            font-size: 12px;
            flex-shrink: 0;
            display: none;
        }
        .song-card.active .play-indicator {
            display: block;
        }
        .song-card.active {
            background: #1a1a1a;
        }
        .song-card.active .info .title {
            color: #ff6b6b;
        }

        /* ===== PANEL CENTER — REFERENCE IMAGE / MAIN ===== */
        .panel-center {
            background: #111;
            border-radius: 24px;
            overflow: hidden;
            padding: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 680px;
        }
        .panel-center .ref-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            border-radius: 24px;
            background: #0a0a0a;
        }
        .panel-center .ref-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 14px;
            gap: 10px;
            padding: 40px;
            text-align: center;
        }
        .panel-center .ref-placeholder i {
            font-size: 48px;
            color: #333;
        }
        .panel-center .ref-placeholder span {
            font-weight: 300;
        }

        /* ===== PANEL RIGHT — NOW PLAYING ===== */
        .panel-right {
            background: #111;
            border-radius: 24px;
            padding: 18px 16px 14px 16px;
            display: flex;
            flex-direction: column;
        }
        .panel-right .np-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
        }
        .panel-right .np-header .np-title {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
        }
        .panel-right .np-header .heart {
            color: #666;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.2s;
            background: none;
            border: none;
            font-family: 'Poppins', sans-serif;
        }
        .panel-right .np-header .heart:hover,
        .panel-right .np-header .heart.liked {
            color: #ff6b6b;
        }

        .panel-right .np-cover {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 18px;
            object-fit: cover;
            background: #1a1a1a;
            margin-bottom: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: all 0.3s;
        }

        .panel-right .np-song-info {
            text-align: center;
            margin-bottom: 12px;
        }
        .panel-right .np-song-info .song-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .panel-right .np-song-info .song-artist {
            font-size: 13px;
            color: #9a9a9a;
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .panel-right .progress-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .panel-right .progress-container .time {
            font-size: 10px;
            color: #9a9a9a;
            font-weight: 400;
            min-width: 28px;
        }
        .panel-right .progress-track {
            flex: 1;
            height: 4px;
            background: #2a2a2a;
            border-radius: 4px;
            position: relative;
            cursor: pointer;
        }
        .panel-right .progress-track .progress-fill {
            height: 100%;
            width: 0%;
            background: #ff6b6b;
            border-radius: 4px;
            position: relative;
            transition: width 0.1s linear;
        }
        .panel-right .progress-track .progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff6b6b;
            box-shadow: 0 0 12px rgba(255, 107, 107, 0.4);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .panel-right .progress-track:hover .progress-fill::after {
            opacity: 1;
        }

        .panel-right .playback-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            margin-bottom: 12px;
        }
        .panel-right .playback-controls .ctrl-btn {
            background: none;
            border: none;
            color: #ccc;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.2s, transform 0.15s;
            font-family: 'Poppins', sans-serif;
            padding: 4px;
        }
        .panel-right .playback-controls .ctrl-btn:hover {
            color: #fff;
        }
        .panel-right .playback-controls .ctrl-btn:active {
            transform: scale(0.92);
        }
        .panel-right .playback-controls .ctrl-btn.play-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #ff6b6b;
            color: #fff;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.35);
        }
        .panel-right .playback-controls .ctrl-btn.play-btn:hover {
            background: #ff7a7a;
            color: #fff;
            transform: scale(1.04);
        }

        .panel-right .func-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
            padding-top: 2px;
        }
        .panel-right .func-row .func-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 16px;
            cursor: pointer;
            transition: color 0.2s;
            font-family: 'Poppins', sans-serif;
        }
        .panel-right .func-row .func-btn:hover {
            color: #fff;
        }
        .panel-right .func-row .func-btn.active {
            color: #ff6b6b;
        }

        .panel-right .np-bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-top: 12px;
            margin-top: auto;
            border-top: 1px solid #1a1a1a;
        }
        .panel-right .np-bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #666;
            font-size: 9px;
            cursor: pointer;
            transition: color 0.2s;
            background: none;
            border: none;
            font-family: 'Poppins', sans-serif;
            padding: 4px 8px;
        }
        .panel-right .np-bottom-nav .nav-item i {
            font-size: 18px;
        }
        .panel-right .np-bottom-nav .nav-item.active {
            color: #ff6b6b;
        }
        .panel-right .np-bottom-nav .nav-item:hover {
            color: #fff;
        }

        /* ===== SCROLLBAR GLOBAL ===== */
        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff6b6b;
            border-radius: 10px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1100px) {
            .app-wrapper {
                grid-template-columns: 280px 1fr 300px;
                gap: 12px;
                padding: 12px;
            }
            .panel {
                padding: 12px 12px 10px 12px;
                min-height: 600px;
            }
            .panel-center {
                min-height: 600px;
            }
            .song-card .cover {
                width: 38px;
                height: 38px;
            }
            .panel-right .np-cover {
                border-radius: 14px;
            }
            .panel-right .np-song-info .song-title {
                font-size: 16px;
            }
        }

        @media (max-width: 860px) {
            .app-wrapper {
                grid-template-columns: 1fr;
                gap: 18px;
                max-width: 480px;
                min-height: auto;
                padding: 14px;
                border-radius: 24px;
            }
            .panel {
                min-height: auto;
                max-height: 560px;
            }
            .panel-center {
                min-height: 320px;
                max-height: 420px;
            }
            .panel-center .ref-image {
                max-height: 400px;
                object-fit: contain;
            }
            .panel-left {
                order: 1;
                max-height: 480px;
            }
            .panel-center {
                order: 2;
            }
            .panel-right {
                order: 3;
                max-height: 520px;
            }
            .panel-right .np-cover {
                max-width: 240px;
                margin-left: auto;
                margin-right: auto;
            }
            .song-card .cover {
                width: 40px;
                height: 40px;
            }
        }

        @media (max-width: 440px) {
            body {
                padding: 10px;
            }
            .app-wrapper {
                padding: 10px;
                border-radius: 18px;
                gap: 12px;
            }
            .panel {
                padding: 10px 10px 8px 10px;
                border-radius: 16px;
                max-height: 460px;
            }
            .panel-center {
                min-height: 220px;
                max-height: 280px;
            }
            .panel-right .np-cover {
                max-width: 160px;
            }
            .panel-right .np-song-info .song-title {
                font-size: 14px;
            }
            .panel-right .playback-controls .ctrl-btn.play-btn {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
            .panel-left .panel-header h2 {
                font-size: 16px;
            }
            .song-card .cover {
                width: 34px;
                height: 34px;
            }
            .song-card .info .title {
                font-size: 12px;
            }
            .song-card .info .artist {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">

        <!-- ============================================================ -->
        <!-- PANEL LEFT — ALBUM / SONG LIST                               -->
        <!-- ============================================================ -->
        <div class="panel panel-left">
            <div class="panel-header">
                <h2>🎵 My Music</h2>
                <div class="avatar">
                    <img src="https://i.pravatar.cc/80?img=11" alt="avatar" />
                </div>
            </div>

            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search album, song..." id="searchInput" />
            </div>

            <div class="section-label">
                <span>Most Popular</span>
                <a href="#">View All</a>
            </div>
            <div class="panel-scroll" id="mostPopularList"></div>

            <div class="section-label" style="margin-top:6px;">
                <span>Upcoming</span>
                <a href="#">View All</a>
            </div>
            <div class="panel-scroll" id="upcomingList" style="max-height:180px;"></div>
        </div>

        <!-- ============================================================ -->
        <!-- PANEL CENTER — REFERENCE IMAGE                               -->
        <!-- ============================================================ -->
        <div class="panel panel-center" id="panelCenter">
            <img class="ref-image" src="https://i.ibb.co/0jqH0kL/reference-music-app.png" alt="Reference Music App"
            onerror="this.style.display='none'; document.getElementById('refFallback').style.display='flex';" />
            <div class="ref-placeholder" id="refFallback" style="display:none;">
                <i class="fas fa-music"></i>
                <span>🎵 Your reference image goes here</span>
                <span style="font-size:12px;color:#444;">(Replace src with your image URL)</span>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- PANEL RIGHT — NOW PLAYING                                   -->
        <!-- ============================================================ -->
        <div class="panel panel-right">

            <!-- HEADER -->
            <div class="np-header">
                <span class="np-title">Now Playing</span>
                <button class="heart" id="npHeart"><i class="fas fa-heart"></i></button>
            </div>

            <!-- COVER -->
            <img class="np-cover" id="npCover" src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400&h=400&fit=crop&crop=center" alt="cover" />

            <!-- SONG INFO -->
            <div class="np-song-info">
                <div class="song-title" id="npSongTitle">Feel Your Arms</div>
                <div class="song-artist" id="npSongArtist">Justin Bieber</div>
            </div>

            <!-- PROGRESS -->
            <div class="progress-container">
                <span class="time" id="npCurrentTime">0:00</span>
                <div class="progress-track" id="progressTrack">
                    <div class="progress-fill" id="progressFill" style="width:0%;"></div>
                </div>
                <span class="time" id="npTotalTime">0:00</span>
            </div>

            <!-- PLAYBACK CONTROLS -->
            <div class="playback-controls">
                <button class="ctrl-btn" id="npPrev"><i class="fas fa-step-backward"></i></button>
                <button class="ctrl-btn play-btn" id="npPlayPause"><i class="fas fa-play"></i></button>
                <button class="ctrl-btn" id="npNext"><i class="fas fa-step-forward"></i></button>
            </div>

            <!-- FUNCTION ROW -->
            <div class="func-row">
                <button class="func-btn"><i class="fas fa-random"></i></button>
                <button class="func-btn"><i class="fas fa-undo-alt"></i></button>
                <button class="func-btn"><i class="fas fa-list-ul"></i></button>
                <button class="func-btn"><i class="fas fa-volume-up"></i></button>
            </div>

            <!-- BOTTOM NAV -->
            <div class="np-bottom-nav">
                <button class="nav-item active"><i class="fas fa-home"></i> Home</button>
                <button class="nav-item"><i class="fas fa-compact-disc"></i> Album</button>
                <button class="nav-item"><i class="fas fa-music"></i> My Music</button>
                <button class="nav-item"><i class="fas fa-user"></i> Profile</button>
            </div>

        </div>
    </div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT                                                    -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // DATA LAGU
        // ============================================================
        const songData = [

            { artist: "Ariana Grande", title: "Position", cover: "https://images.unsplash.com/photo-1511671782779-c97d50d27f75?w=400&h=400&fit=crop&crop=center" },

            { artist: "Agnes Monica", title: "Matahariku", cover: "https://i.scdn.co/image/14b0710e72613cdda880302cd615d2ff8ac87812" },
            { artist: "Maudy Ayunda", title: "Kamu Dan Kenangan", cover: "https://i.scdn.co/image/ab67616d0000b273bc1e873a4ac4d86f563680a0" },
        ];

        // ============================================================
        // DOM REFS
        // ============================================================
        const mostPopularList = document.getElementById('mostPopularList');
        const upcomingList = document.getElementById('upcomingList');
        const searchInput = document.getElementById('searchInput');

        const npCover = document.getElementById('npCover');
        const npSongTitle = document.getElementById('npSongTitle');
        const npSongArtist = document.getElementById('npSongArtist');
        const npCurrentTime = document.getElementById('npCurrentTime');
        const npTotalTime = document.getElementById('npTotalTime');
        const progressFill = document.getElementById('progressFill');
        const progressTrack = document.getElementById('progressTrack');
        const npPlayPause = document.getElementById('npPlayPause');
        const npPrev = document.getElementById('npPrev');
        const npNext = document.getElementById('npNext');
        const npHeart = document.getElementById('npHeart');

        // ============================================================
        // STATE
        // ============================================================
        let currentSongIndex = 0;
        let isPlaying = false;
        let isLiked = false;
        let currentList = 'popular'; // 'popular' | 'upcoming' | 'search'

        const audio = new Audio();

        // ============================================================
        // FUNGSI
        // ============================================================
        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        function loadSong(index, fromList = 'popular') {
            const song = songData[index];
            if (!song) return;
            currentSongIndex = index;
            currentList = fromList;
            npCover.src = song.cover || 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400&h=400&fit=crop&crop=center';
            npSongTitle.textContent = song.title || 'Untitled';
            npSongArtist.textContent = song.artist || 'Unknown Artist';
            // audio.src = song.src || ''; // tidak ada file mp3, pakai dummy
            audio.src = ''; // dummy
            npTotalTime.textContent = '3:00';
            npCurrentTime.textContent = '0:00';
            progressFill.style.width = '0%';
            isPlaying = false;
            npPlayPause.innerHTML = '<i class="fas fa-play"></i>';

            // highlight di list
            document.querySelectorAll('.song-card').forEach(el => el.classList.remove('active'));
            const cards = document.querySelectorAll('.song-card');
            let target = null;
            for (const card of cards) {
                if (parseInt(card.dataset.index) === index) {
                    target = card;
                    break;
                }
            }
            if (target) target.classList.add('active');

            // reset simulasi
            if (simInterval) clearInterval(simInterval);
        }

        function togglePlay() {
            if (isPlaying) {
                // pause
                npPlayPause.innerHTML = '<i class="fas fa-play"></i>';
                isPlaying = false;
                if (simInterval) clearInterval(simInterval);
            } else {
                // play
                npPlayPause.innerHTML = '<i class="fas fa-pause"></i>';
                isPlaying = true;
                simulateProgress();
            }
        }

        let simInterval = null;
        let simProgress = 0;

        function simulateProgress() {
            if (simInterval) clearInterval(simInterval);
            simProgress = parseFloat(progressFill.style.width) || 0;
            if (simProgress >= 100) simProgress = 0;

            simInterval = setInterval(() => {
                if (!isPlaying) return;
                simProgress += 0.4;
                if (simProgress > 100) {
                    simProgress = 0;
                    // auto next
                    nextSong();
                    return;
                }
                progressFill.style.width = simProgress + '%';
                const totalSec = 180;
                const currentSec = (simProgress / 100) * totalSec;
                npCurrentTime.textContent = formatTime(currentSec);
                npTotalTime.textContent = formatTime(totalSec);
            }, 150);
        }

        function prevSong() {
            currentSongIndex = (currentSongIndex - 1 + songData.length) % songData.length;
            loadSong(currentSongIndex, currentList);
            if (isPlaying) {
                isPlaying = false;
                togglePlay();
            }
        }

        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % songData.length;
            loadSong(currentSongIndex, currentList);
            if (isPlaying) {
                isPlaying = false;
                togglePlay();
            }
        }

        // ============================================================
        // RENDER LISTS
        // ============================================================
        function renderSongCards(container, items, startIndex) {
            container.innerHTML = items.map((s, i) => {
                const idx = startIndex + i;
                return `
                    <div class="song-card" data-index="${idx}" data-title="${s.title.toLowerCase()}" data-artist="${s.artist.toLowerCase()}">
                        <img class="cover" src="${s.cover || 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=100&h=100&fit=crop&crop=center'}" alt="${s.title}" />
                        <div class="info">
                            <div class="title">${s.title}</div>
                            <div class="artist">${s.artist}</div>
                        </div>
                        <span class="play-indicator"><i class="fas fa-play"></i></span>
                    </div>
                `;
            }).join('');

            container.querySelectorAll('.song-card').forEach(el => {
                el.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    loadSong(idx, 'popular');
                    if (!isPlaying) {
                        togglePlay();
                    } else {
                        // restart
                        isPlaying = false;
                        togglePlay();
                    }
                });
            });
        }

        function renderAll() {
            const popular = songData.slice(0, 8);
            const upcoming = songData.slice(8, 16);
            renderSongCards(mostPopularList, popular, 0);
            renderSongCards(upcomingList, upcoming, 8);
        }

        // ============================================================
        // SEARCH
        // ============================================================
        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            if (query === '') {
                renderAll();
                return;
            }
            const filtered = songData.filter(s =>
                s.title.toLowerCase().includes(query) ||
                s.artist.toLowerCase().includes(query)
            );
            // tampilkan di mostPopularList, kosongkan upcoming
            mostPopularList.innerHTML = filtered.map((s, i) => {
                const idx = songData.indexOf(s);
                return `
                    <div class="song-card" data-index="${idx}" data-title="${s.title.toLowerCase()}" data-artist="${s.artist.toLowerCase()}">
                        <img class="cover" src="${s.cover || 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=100&h=100&fit=crop&crop=center'}" alt="${s.title}" />
                        <div class="info">
                            <div class="title">${s.title}</div>
                            <div class="artist">${s.artist}</div>
                        </div>
                        <span class="play-indicator"><i class="fas fa-play"></i></span>
                    </div>
                `;
            }).join('');
            upcomingList.innerHTML = '';

            mostPopularList.querySelectorAll('.song-card').forEach(el => {
                el.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    loadSong(idx, 'search');
                    if (!isPlaying) {
                        togglePlay();
                    } else {
                        isPlaying = false;
                        togglePlay();
                    }
                });
            });
        });

        // ============================================================
        // CONTROLS
        // ============================================================
        npPlayPause.addEventListener('click', togglePlay);
        npPrev.addEventListener('click', prevSong);
        npNext.addEventListener('click', nextSong);

        // progress click
        progressTrack.addEventListener('click', (e) => {
            const rect = progressTrack.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            progressFill.style.width = (pct * 100) + '%';
            npCurrentTime.textContent = formatTime(Math.floor(pct * 180));
            if (isPlaying) {
                simProgress = pct * 100;
            }
        });

        // heart
        npHeart.addEventListener('click', () => {
            isLiked = !isLiked;
            npHeart.classList.toggle('liked', isLiked);
            npHeart.style.color = isLiked ? '#ff6b6b' : '#666';
        });

        // ============================================================
        // KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            }
            if (e.code === 'ArrowRight') {
                e.preventDefault();
                nextSong();
            }
            if (e.code === 'ArrowLeft') {
                e.preventDefault();
                prevSong();
            }
        });

        // ============================================================
        // INIT
        // ============================================================
        renderAll();
        loadSong(0, 'popular');

        console.log('🎵 3-Panel Music App loaded!');
    </script>

</body>
</html>
