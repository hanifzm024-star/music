<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ===== PHONE FRAMES WRAPPER ===== */
        .phones-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 30px;
            max-width: 1260px;
            width: 100%;
        }

        /* ===== PHONE FRAME ===== */
        .phone {
            background: #0f0f0f;
            border-radius: 38px;
            padding: 16px 12px 12px 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 0 2px #2a2a2a inset;
            width: 100%;
            max-width: 360px;
            flex-shrink: 0;
            transition: transform 0.2s;
        }
        .phone:hover {
            transform: translateY(-4px);
        }
        .phone-screen {
            background: #111;
            border-radius: 28px;
            overflow: hidden;
            padding: 16px 18px 12px 18px;
            min-height: 680px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ===== SCROLLBAR ===== */
        .phone-screen::-webkit-scrollbar {
            width: 3px;
        }
        .phone-screen::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        .phone-screen::-webkit-scrollbar-thumb {
            background: #ff6b6b;
            border-radius: 10px;
        }

        /* ===== TYPOGRAPHY ===== */
        .text-white {
            color: #fff;
        }
        .text-muted {
            color: #9a9a9a;
        }
        .text-accent {
            color: #ff6b6b;
        }
        .fw-300 {
            font-weight: 300;
        }
        .fw-400 {
            font-weight: 400;
        }
        .fw-500 {
            font-weight: 500;
        }
        .fw-600 {
            font-weight: 600;
        }
        .fw-700 {
            font-weight: 700;
        }
        .fw-800 {
            font-weight: 800;
        }
        .fs-small {
            font-size: 11px;
        }
        .fs-12 {
            font-size: 12px;
        }
        .fs-13 {
            font-size: 13px;
        }
        .fs-14 {
            font-size: 14px;
        }
        .fs-15 {
            font-size: 15px;
        }
        .fs-16 {
            font-size: 16px;
        }
        .fs-18 {
            font-size: 18px;
        }
        .fs-20 {
            font-size: 20px;
        }
        .fs-22 {
            font-size: 22px;
        }
        .fs-24 {
            font-size: 24px;
        }
        .fs-28 {
            font-size: 28px;
        }
        .fs-32 {
            font-size: 32px;
        }
        .fs-36 {
            font-size: 36px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
        }
        .header-left {
            display: flex;
            flex-direction: column;
        }
        .header-left .greeting {
            font-size: 12px;
            color: #9a9a9a;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .header-left .username {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            line-height: 1.2;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .header-right .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
            color: #fff;
            overflow: hidden;
            flex-shrink: 0;
        }
        .header-right .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .header-right .icon-btn {
            color: #ccc;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .header-right .icon-btn:hover {
            color: #fff;
        }

        /* ===== SEARCH BAR ===== */
        .search-bar {
            background: #1e1e1e;
            border-radius: 30px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            border: 1px solid #2a2a2a;
            transition: border 0.2s;
        }
        .search-bar:focus-within {
            border-color: #ff6b6b;
        }
        .search-bar i {
            color: #666;
            font-size: 14px;
        }
        .search-bar input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            width: 100%;
        }
        .search-bar input::placeholder {
            color: #555;
            font-weight: 300;
        }

        /* ===== BANNER ===== */
        .banner {
            background: linear-gradient(135deg, #7b2ffc, #3b1f8a);
            border-radius: 16px;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            min-height: 80px;
            position: relative;
            overflow: hidden;
        }
        .banner::after {
            content: '';
            position: absolute;
            right: -30px;
            top: -30px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
        }
        .banner-left .banner-title {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            line-height: 1;
        }
        .banner-left .banner-sub {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 400;
            margin-top: 2px;
        }
        .banner-right {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 8px 16px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .banner-right .btn-premium {
            color: #fff;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }
        .banner-right .btn-premium i {
            font-size: 14px;
        }

        /* ===== SECTION HEADER ===== */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .section-header h3 {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }
        .section-header a {
            font-size: 12px;
            color: #ff6b6b;
            text-decoration: none;
            font-weight: 500;
        }

        /* ===== HORIZONTAL SCROLL ===== */
        .scroll-horizontal {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding-bottom: 8px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 18px;
        }
        .scroll-horizontal::-webkit-scrollbar {
            height: 2px;
        }
        .scroll-horizontal::-webkit-scrollbar-thumb {
            background: #ff6b6b;
            border-radius: 10px;
        }
        .scroll-horizontal::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .scroll-item {
            flex-shrink: 0;
            scroll-snap-align: start;
            width: 120px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .scroll-item:hover {
            transform: scale(1.02);
        }
        .scroll-item .cover {
            width: 120px;
            height: 120px;
            border-radius: 12px;
            object-fit: cover;
            background: #1a1a1a;
            display: block;
        }
        .scroll-item .title {
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            margin-top: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .scroll-item .artist {
            font-size: 11px;
            color: #9a9a9a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .scroll-item .download-badge {
            font-size: 10px;
            color: #9a9a9a;
            margin-top: 2px;
        }

        /* ===== RECENTLY PLAYED LIST ===== */
        .recent-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
            max-height: 280px;
            padding-right: 4px;
        }
        .recent-list::-webkit-scrollbar {
            width: 2px;
        }
        .recent-list::-webkit-scrollbar-thumb {
            background: #ff6b6b;
            border-radius: 10px;
        }
        .recent-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 8px;
            border-radius: 10px;
            transition: background 0.2s;
            cursor: pointer;
        }
        .recent-item:hover {
            background: #1a1a1a;
        }
        .recent-item .thumb {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
            background: #1a1a1a;
        }
        .recent-item .info {
            flex: 1;
            min-width: 0;
        }
        .recent-item .info .title {
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .recent-item .info .artist {
            font-size: 11px;
            color: #9a9a9a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .recent-item .more-btn {
            color: #666;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            transition: color 0.2s;
            flex-shrink: 0;
        }
        .recent-item .more-btn:hover {
            color: #fff;
        }
        .recent-item .duration {
            font-size: 11px;
            color: #666;
            flex-shrink: 0;
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-top: 14px;
            margin-top: auto;
            border-top: 1px solid #1a1a1a;
            margin-bottom: 4px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #666;
            font-size: 10px;
            cursor: pointer;
            transition: color 0.2s;
            background: none;
            border: none;
            font-family: 'Poppins', sans-serif;
            padding: 4px 12px;
        }
        .nav-item i {
            font-size: 20px;
        }
        .nav-item.active {
            color: #ff6b6b;
        }
        .nav-item:hover {
            color: #fff;
        }
        .nav-item.active:hover {
            color: #ff6b6b;
        }

        /* ===== NOW PLAYING SPECIFIC ===== */
        .np-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
        }
        .np-header .back {
            color: #ccc;
            font-size: 20px;
            cursor: pointer;
            transition: color 0.2s;
            background: none;
            border: none;
            font-family: 'Poppins', sans-serif;
        }
        .np-header .back:hover {
            color: #fff;
        }
        .np-header .np-title {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
        }
        .np-header .heart {
            color: #666;
            font-size: 20px;
            cursor: pointer;
            transition: color 0.2s;
            background: none;
            border: none;
        }
        .np-header .heart:hover,
        .np-header .heart.liked {
            color: #ff6b6b;
        }

        .np-cover {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 20px;
            object-fit: cover;
            background: #1a1a1a;
            margin-bottom: 18px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }

        .np-song-info {
            text-align: center;
            margin-bottom: 14px;
        }
        .np-song-info .song-title {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 2px;
        }
        .np-song-info .song-artist {
            font-size: 14px;
            color: #9a9a9a;
            font-weight: 400;
        }

        /* ===== PROGRESS SLIDER ===== */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .progress-container .time {
            font-size: 11px;
            color: #9a9a9a;
            font-weight: 400;
            min-width: 32px;
        }
        .progress-track {
            flex: 1;
            height: 4px;
            background: #2a2a2a;
            border-radius: 4px;
            position: relative;
            cursor: pointer;
        }
        .progress-track .progress-fill {
            height: 100%;
            width: 0%;
            background: #ff6b6b;
            border-radius: 4px;
            position: relative;
            transition: width 0.1s linear;
        }
        .progress-track .progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff6b6b;
            box-shadow: 0 0 12px rgba(255, 107, 107, 0.4);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .progress-track:hover .progress-fill::after {
            opacity: 1;
        }

        /* ===== PLAYBACK CONTROLS ===== */
        .playback-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
            margin-bottom: 14px;
        }
        .playback-controls .ctrl-btn {
            background: none;
            border: none;
            color: #ccc;
            font-size: 22px;
            cursor: pointer;
            transition: color 0.2s, transform 0.15s;
            font-family: 'Poppins', sans-serif;
            padding: 4px;
        }
        .playback-controls .ctrl-btn:hover {
            color: #fff;
        }
        .playback-controls .ctrl-btn:active {
            transform: scale(0.92);
        }
        .playback-controls .ctrl-btn.play-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #ff6b6b;
            color: #fff;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 24px rgba(255, 107, 107, 0.35);
        }
        .playback-controls .ctrl-btn.play-btn:hover {
            background: #ff7a7a;
            color: #fff;
            transform: scale(1.04);
        }

        /* ===== FUNCTION ROW ===== */
        .func-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 32px;
            padding-top: 6px;
        }
        .func-row .func-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.2s;
            font-family: 'Poppins', sans-serif;
        }
        .func-row .func-btn:hover {
            color: #fff;
        }
        .func-row .func-btn.active {
            color: #ff6b6b;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 820px) {
            .phones-wrapper {
                flex-direction: column;
                align-items: center;
                gap: 40px;
            }
            .phone {
                max-width: 360px;
                width: 100%;
            }
            body {
                padding: 16px;
            }
        }
        @media (max-width: 400px) {
            .phone {
                padding: 10px 8px 8px 8px;
                border-radius: 28px;
            }
            .phone-screen {
                padding: 12px 14px 10px 14px;
                min-height: 600px;
            }
            .banner {
                padding: 14px 16px;
                min-height: 68px;
            }
            .banner-left .banner-title {
                font-size: 20px;
            }
            .scroll-item {
                width: 100px;
            }
            .scroll-item .cover {
                width: 100px;
                height: 100px;
            }
            .np-song-info .song-title {
                font-size: 18px;
            }
            .playback-controls .ctrl-btn.play-btn {
                width: 48px;
                height: 48px;
                font-size: 22px;
            }
            .recent-list {
                max-height: 200px;
            }
        }
        @media (min-width: 821px) and (max-width: 1100px) {
            .phones-wrapper {
                gap: 20px;
            }
            .phone {
                max-width: 300px;
            }
            .scroll-item {
                width: 100px;
            }
            .scroll-item .cover {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>

    <div class="phones-wrapper">

        <!-- ============================================================ -->
        <!-- PHONE 1: HOME                                                 -->
        <!-- ============================================================ -->
        <div class="phone" id="phone-home">
            <div class="phone-screen">

                <!-- HEADER -->
                <div class="header">
                    <div class="header-left">
                        <span class="greeting">hi haniff</span>
                        <span class="username">John Johnson</span>
                    </div>
                    <div class="header-right">
                        <i class="fas fa-bell icon-btn"></i>
                        <div class="avatar">
                            <img src="https://i.pravatar.cc/80?img=11" alt="avatar" />
                        </div>
                    </div>
                </div>

                <!-- SEARCH -->
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search album, song" />
                </div>

                <!-- BANNER -->
                <div class="banner">
                    <div class="banner-left">
                        <div class="banner-title">40%</div>
                        <div class="banner-title" style="font-size:20px;margin-top:-2px;">OFF</div>
                        <div class="banner-sub">Get Unlimited Download</div>
                    </div>
                    <div class="banner-right">
                        <button class="btn-premium">
                            <i class="fas fa-crown"></i> PREMIUM NOW
                        </button>
                    </div>
                </div>

                <!-- MOST POPULAR -->
                <div class="section-header">
                    <h3>Most Popular</h3>
                    <a href="#">View All</a>
                </div>
                <div class="scroll-horizontal" id="mostPopularScroll"></div>

                <!-- BOTTOM NAV -->
                <div class="bottom-nav">
                    <button class="nav-item active"><i class="fas fa-home"></i> Home</button>
                    <button class="nav-item"><i class="fas fa-compact-disc"></i> Album</button>
                    <button class="nav-item"><i class="fas fa-music"></i> My Music</button>
                    <button class="nav-item"><i class="fas fa-user"></i> Profile</button>
                </div>

            </div>
        </div>

        <!-- ============================================================ -->
        <!-- PHONE 2: UPCOMING / RECENTLY PLAYED                          -->
        <!-- ============================================================ -->
        <div class="phone" id="phone-upcoming">
            <div class="phone-screen">

                <!-- HEADER -->
                <div class="header">
                    <div class="header-left">
                        <span class="greeting">hi haniff</span>
                        <span class="username">John Johnson</span>
                    </div>
                    <div class="header-right">
                        <i class="fas fa-bell icon-btn"></i>
                        <div class="avatar">
                            <img src="https://i.pravatar.cc/80?img=11" alt="avatar" />
                        </div>
                    </div>
                </div>

                <!-- SEARCH -->
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search album, song" />
                </div>

                <!-- UPCOMING -->
                <div class="section-header">
                    <h3>Upcoming</h3>
                    <a href="#">View All</a>
                </div>
                <div class="scroll-horizontal" id="upcomingScroll"></div>

                <!-- RECENTLY PLAYED -->
                <div class="section-header" style="margin-top:4px;">
                    <h3>Recently Play</h3>
                    <a href="#">View All</a>
                </div>
                <div class="recent-list" id="recentlyPlayedList"></div>

                <!-- BOTTOM NAV -->
                <div class="bottom-nav">
                    <button class="nav-item"><i class="fas fa-home"></i> Home</button>
                    <button class="nav-item active"><i class="fas fa-compact-disc"></i> Album</button>
                    <button class="nav-item"><i class="fas fa-music"></i> My Music</button>
                    <button class="nav-item"><i class="fas fa-user"></i> Profile</button>
                </div>

            </div>
        </div>

        <!-- ============================================================ -->
        <!-- PHONE 3: NOW PLAYING                                         -->
        <!-- ============================================================ -->
        <div class="phone" id="phone-nowplaying">
            <div class="phone-screen">

                <!-- HEADER -->
                <div class="np-header">
                    <button class="back" id="npBack"><i class="fas fa-chevron-left"></i></button>
                    <span class="np-title">Now Playing</span>
                    <button class="heart" id="npHeart"><i class="fas fa-heart"></i></button>
                </div>

                <!-- COVER -->
                <img class="np-cover" id="npCover" src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=600&h=600&fit=crop&crop=center" alt="cover" />

                <!-- SONG INFO -->
                <div class="np-song-info">
                    <div class="song-title" id="npSongTitle">Feel Your Arms</div>
                    <div class="song-artist" id="npSongArtist">Justin Bieber</div>
                </div>

                <!-- PROGRESS -->
                <div class="progress-container">
                    <span class="time" id="npCurrentTime">0:00</span>
                    <div class="progress-track" id="progressTrack">
                        <div class="progress-fill" id="progressFill" style="width:0%;"></div>
                    </div>
                    <span class="time" id="npTotalTime">0:00</span>
                </div>

                <!-- PLAYBACK CONTROLS -->
                <div class="playback-controls">
                    <button class="ctrl-btn" id="npPrev"><i class="fas fa-step-backward"></i></button>
                    <button class="ctrl-btn play-btn" id="npPlayPause"><i class="fas fa-play"></i></button>
                    <button class="ctrl-btn" id="npNext"><i class="fas fa-step-forward"></i></button>
                </div>

        }, {

            title: "Seluruh Cinta",
            src: "assets/Cakra Khan feat Siti Nurhaliza - Seluruh Cinta.mp3",
            cover: "https://i.scdn.co/image/ab67616d0000b273d33c6cc87f8dbad9130c985a"
        }, {
            artist: "Agnes Monica",
            title: "Matahariku",
            src: "assets/Agnes Monica - Matahariku.mp3",
            cover: "https://i.scdn.co/image/14b0710e72613cdda880302cd615d2ff8ac87812"
        }, {
            artist: "Maudy Ayunda",
            title: "Kamu Dan Kenangan",
            src: "assets/Maudy Ayunda - Kamu Dan Kenangan.mp3",
            cover: "https://i.scdn.co/image/ab67616d0000b273bc1e873a4ac4d86f563680a0"
        }, {
            artist: "Ari Lesmana",
            title: "Sesi Potret",
            src: "assets/Ari Lesmana - Sesi Potret.mp3",
            cover: "https://i.scdn.co/image/ab67616d0000b273172768978c7f929803ad7e8b"
        }, {
            artist: "ANDMESH",
            title: "ANDAIKAN KAU DATANG",
            src: "assets/ANDMESH - ANDAIKAN KAU DATANG.mp3",
            cover: "https://i.scdn.co/image/ab67616d00001e02e2fc4fcab619222ecdaa7d74"
        }];

        // ============================================================
        // DOM REFS
        // ============================================================
        const mostPopularScroll = document.getElementById('mostPopularScroll');
        const upcomingScroll = document.getElementById('upcomingScroll');
        const recentlyPlayedList = document.getElementById('recentlyPlayedList');

        const npCover = document.getElementById('npCover');
        const npSongTitle = document.getElementById('npSongTitle');
        const npSongArtist = document.getElementById('npSongArtist');
        const npCurrentTime = document.getElementById('npCurrentTime');
        const npTotalTime = document.getElementById('npTotalTime');
        const progressFill = document.getElementById('progressFill');
        const progressTrack = document.getElementById('progressTrack');
        const npPlayPause = document.getElementById('npPlayPause');
        const npPrev = document.getElementById('npPrev');
        const npNext = document.getElementById('npNext');
        const npHeart = document.getElementById('npHeart');
        const npBack = document.getElementById('npBack');

        // ============================================================
        // AUDIO
        // ============================================================
        let currentSongIndex = 0;
        let isPlaying = false;
        let isLiked = false;

        const audio = new Audio();

        // fallback jika file audio tidak ditemukan – pakai dummy
        function loadSong(index) {
            const song = songData[index];
            if (!song) return;
            npCover.src = song.cover || 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=600&h=600&fit=crop&crop=center';
            npSongTitle.textContent = song.title || 'Untitled';
            npSongArtist.textContent = song.artist || 'Unknown Artist';
            audio.src = song.src || '';
            audio.load();
            npTotalTime.textContent = '0:00';
            npCurrentTime.textContent = '0:00';
            progressFill.style.width = '0%';
            isPlaying = false;
            npPlayPause.innerHTML = '<i class="fas fa-play"></i>';
        }

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        function togglePlay() {
            if (audio.src && audio.src !== '') {
                if (isPlaying) {
                    audio.pause();
                    npPlayPause.innerHTML = '<i class="fas fa-play"></i>';
                } else {
                    audio.play().catch(() => {
                        // fallback: jika file tidak ditemukan, tetap visual
                        npPlayPause.innerHTML = '<i class="fas fa-pause"></i>';
                        isPlaying = true;
                    });
                    npPlayPause.innerHTML = '<i class="fas fa-pause"></i>';
                }
                isPlaying = !isPlaying;
            } else {
                // jika tidak ada src, mainkan dummy
                isPlaying = !isPlaying;
                npPlayPause.innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
                // simulasi progress
                if (isPlaying) simulateProgress();
            }
        }

        // simulasi progress untuk demo
        let simInterval = null;

        function simulateProgress() {
            if (simInterval) clearInterval(simInterval);
            let p = 0;
            simInterval = setInterval(() => {
                if (!isPlaying) return;
                p += 0.5;
                if (p > 100) { p = 0; }
                progressFill.style.width = p + '%';
                npCurrentTime.textContent = formatTime(Math.floor(p / 100 * 180));
                npTotalTime.textContent = '3:00';
            }, 200);
        }

        // event audio
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = pct + '%';
                npCurrentTime.textContent = formatTime(audio.currentTime);
                npTotalTime.textContent = formatTime(audio.duration);
            }
        });

        audio.addEventListener('ended', () => {
            isPlaying = false;
            npPlayPause.innerHTML = '<i class="fas fa-play"></i>';
            nextSong();
        });

        audio.addEventListener('play', () => {
            isPlaying = true;
            npPlayPause.innerHTML = '<i class="fas fa-pause"></i>';
        });
        audio.addEventListener('pause', () => {
            isPlaying = false;
            npPlayPause.innerHTML = '<i class="fas fa-play"></i>';
        });

        // ============================================================
        // CONTROLS
        // ============================================================
        function prevSong() {
            currentSongIndex = (currentSongIndex - 1 + songData.length) % songData.length;
            loadSong(currentSongIndex);
            if (isPlaying) {
                audio.play().catch(() => {});
            }
        }

        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % songData.length;
            loadSong(currentSongIndex);
            if (isPlaying) {
                audio.play().catch(() => {});
            }
        }

        npPlayPause.addEventListener('click', togglePlay);
        npPrev.addEventListener('click', prevSong);
        npNext.addEventListener('click', nextSong);

        // progress click
        progressTrack.addEventListener('click', (e) => {
            const rect = progressTrack.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            if (audio.duration) {
                audio.currentTime = pct * audio.duration;
            } else {
                // simulasi
                progressFill.style.width = (pct * 100) + '%';
                npCurrentTime.textContent = formatTime(Math.floor(pct * 180));
            }
        });

        // heart
        npHeart.addEventListener('click', () => {
            isLiked = !isLiked;
            npHeart.classList.toggle('liked', isLiked);
            npHeart.style.color = isLiked ? '#ff6b6b' : '#666';
        });

        // back
        npBack.addEventListener('click', () => {
            // scroll ke phone 1
            document.getElementById('phone-home').scrollIntoView({ behavior: 'smooth', block: 'center' });
        });

        // ============================================================
        // RENDER LISTS
        // ============================================================
        function renderMostPopular() {
            const items = songData.slice(0, 6);
            mostPopularScroll.innerHTML = items.map((s, i) => `
                <div class="scroll-item" data-index="${i}">
                    <img class="cover" src="${s.cover || 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=200&h=200&fit=crop&crop=center'}" alt="${s.title}" />
                    <div class="title">${s.title}</div>
                    <div class="artist">${s.artist}</div>
                    <div class="download-badge"><i class="fas fa-download"></i> ${(Math.random()*4+1).toFixed(1)}M</div>
                </div>
            `).join('');
            // click -> play
            mostPopularScroll.querySelectorAll('.scroll-item').forEach(el => {
                el.addEventListener('click', () => {
                    const idx = parseInt(el.dataset.index);
                    currentSongIndex = idx;
                    loadSong(idx);
                    isPlaying = false;
                    togglePlay();
                });
            });
        }

        function renderUpcoming() {
            const items = songData.slice(6, 12);
            upcomingScroll.innerHTML = items.map((s, i) => `
                <div class="scroll-item" data-index="${i+6}">
                    <img class="cover" src="${s.cover || 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=200&h=200&fit=crop&crop=center'}" alt="${s.title}" />
                    <div class="title">${s.title}</div>
                    <div class="artist">${s.artist}</div>
                </div>
            `).join('');
            upcomingScroll.querySelectorAll('.scroll-item').forEach(el => {
                el.addEventListener('click', () => {
                    const idx = parseInt(el.dataset.index);
                    currentSongIndex = idx;
                    loadSong(idx);
                    isPlaying = false;
                    togglePlay();
                });
            });
        }

        function renderRecentlyPlayed() {
            const items = songData.slice(0, 10);
            recentlyPlayedList.innerHTML = items.map((s, i) => `
                <div class="recent-item" data-index="${i}">
                    <img class="thumb" src="${s.cover || 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=100&h=100&fit=crop&crop=center'}" alt="${s.title}" />
                    <div class="info">
                        <div class="title">${s.title}</div>
                        <div class="artist">${s.artist}</div>
                    </div>
                    <span class="duration">${(Math.floor(Math.random()*3)+2)}:${String(Math.floor(Math.random()*60)).padStart(2,'0')}</span>
                    <i class="fas fa-ellipsis-v more-btn"></i>
                </div>
            `).join('');
            recentlyPlayedList.querySelectorAll('.recent-item').forEach(el => {
                el.addEventListener('click', () => {
                    const idx = parseInt(el.dataset.index);
                    currentSongIndex = idx;
                    loadSong(idx);
                    isPlaying = false;
                    togglePlay();
                });
            });
        }

        // ============================================================
        // INIT
        // ============================================================
        renderMostPopular();
        renderUpcoming();
        renderRecentlyPlayed();

        // load default song
        loadSong(0);

        // ============================================================
        // NAV CLICKS – switch screens
        // ============================================================
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', function(e) {
                // highlight
                const parent = this.closest('.phone-screen');
                if (parent) {
                    parent.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                }
                // scroll ke phone yg sesuai
                const phone = this.closest('.phone');
                if (phone) {
                    phone.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });
        });

        // ============================================================
        // KEYBOARD SHORTCUTS (space = play/pause)
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        console.log('🎵 Music App loaded!');
    </script>
