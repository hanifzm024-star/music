<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Music Player | Album View</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0f0c1a 0%, #1a142b 30%, #0d1f2d 70%, #0a1520 100%);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 107, 107, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(78, 205, 196, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 217, 61, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .player-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px);
            border-radius: 2.8rem;
            padding: 2rem 1.8rem 1.8rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
        }

        .player-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.7);
        }

        /* ===== HEADER ===== */
        .player-header {
            text-align: center;
            margin-bottom: 1.8rem;
        }
        .player-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd93d, #ff6b6b, #4ecdc4);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.5px;
        }
        .player-header h1 i {
            background: linear-gradient(135deg, #ff6b6b, #ffd93d);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            font-size: 1.6rem;
        }
        .badge {
            background: rgba(255, 107, 107, 0.15);
            backdrop-filter: blur(4px);
            display: inline-block;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #ffd93d;
            margin-top: 8px;
            border: 1px solid rgba(255, 217, 61, 0.15);
            letter-spacing: 0.5px;
        }
        .badge i {
            color: #4ecdc4;
            margin-right: 6px;
        }

        /* ===== NOW PLAYING ===== */
        .now-playing-area {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border-radius: 1.8rem;
            padding: 1rem 1.5rem;
            margin-bottom: 1.2rem;
            border: 1px solid rgba(255, 217, 61, 0.08);
            position: relative;
            overflow: hidden;
        }
        .now-playing-area::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(78, 205, 196, 0.06), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .now-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            font-weight: 700;
            color: #4ecdc4;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            position: relative;
        }
        .now-label i {
            font-size: 0.7rem;
            color: #ff6b6b;
        }
        .track-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #f0ebff;
            word-break: break-word;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            position: relative;
        }
        .track-title span {
            background: linear-gradient(120deg, #ffffff, #ffd93d);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .album-art-mini {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid rgba(255, 217, 61, 0.2);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.2);
            position: relative;
            overflow: hidden;
        }
        .album-art-mini i {
            font-size: 1.2rem;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        .album-art-mini .vinyl-spin {
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ===== AUDIO ===== */
        audio {
            width: 100%;
            margin: 0.5rem 0 0.3rem;
            border-radius: 60px;
            height: 40px;
        }
        audio::-webkit-media-controls-panel {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 60px;
        }
        audio::-webkit-media-controls-play-button {
            background-color: #ff6b6b;
            border-radius: 50%;
        }
        audio::-webkit-media-controls-current-time-display,
        audio::-webkit-media-controls-time-remaining-display {
            color: #ffd93d;
        }

        /* ===== TRANSPORT ===== */
        .transport-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 6px 0 14px;
            flex-wrap: wrap;
        }
        .transport-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 217, 61, 0.1);
            color: #ffd93d;
            font-weight: 600;
            padding: 0.65rem 1.5rem;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.25s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
        }
        .transport-btn:hover {
            background: rgba(255, 107, 107, 0.15);
            border-color: rgba(255, 107, 107, 0.3);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.15);
            color: #ffffff;
        }
        .transport-btn:active {
            transform: scale(0.96);
        }
        .transport-btn i {
            font-size: 0.85rem;
            color: #4ecdc4;
        }
        .transport-btn:hover i {
            color: #ff6b6b;
        }

        /* ===== SEARCH ===== */
        .search-container {
            margin: 1rem 0 1.2rem;
            position: relative;
        }
        .search-container i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #4ecdc4;
            font-size: 0.85rem;
        }
        #search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(78, 205, 196, 0.15);
            border-radius: 60px;
            padding: 0.8rem 1rem 0.8rem 3rem;
            font-size: 0.85rem;
            color: #f0ebff;
            font-weight: 500;
            outline: none;
            transition: all 0.3s;
            backdrop-filter: blur(4px);
        }
        #search-input:focus {
            border-color: #ffd93d;
            box-shadow: 0 0 0 3px rgba(255, 217, 61, 0.08), 0 0 30px rgba(255, 107, 107, 0.05);
            background: rgba(255, 255, 255, 0.06);
        }
        #search-input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        /* ===== PLAYLIST ===== */
        .playlist-section {
            margin-top: 0.3rem;
        }
        .playlist-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #4ecdc4;
            margin-bottom: 1rem;
            padding-left: 4px;
        }
        .playlist-header i {
            color: #ff6b6b;
            font-size: 0.9rem;
        }

        .playlist-list {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
            scrollbar-width: thin;
        }
        .playlist-list::-webkit-scrollbar {
            width: 3px;
        }
        .playlist-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }
        .playlist-list::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #ff6b6b, #ffd93d);
            border-radius: 10px;
        }

        /* ===== ALBUM CARDS ===== */
        .album-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            border-radius: 1.5rem;
            padding: 1.2rem 1.2rem 1rem;
            margin-bottom: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .album-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(78, 205, 196, 0.03), transparent 60%);
            pointer-events: none;
            border-radius: 1.5rem;
        }
        .album-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 217, 61, 0.08);
            transform: translateX(4px);
        }
        .album-card.hidden-group {
            display: none;
        }

        .album-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 10px;
            cursor: default;
        }
        .album-cover {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        .album-cover i {
            font-size: 1.4rem;
            color: rgba(255, 255, 255, 0.8);
        }
        .album-cover .cover-badge {
            position: absolute;
            bottom: -4px;
            right: -4px;
            background: rgba(255, 107, 107, 0.2);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.5rem;
            border: 1px solid rgba(255, 217, 61, 0.2);
        }
        .album-info {
            flex: 1;
        }
        .album-info .artist-name {
            font-weight: 700;
            font-size: 1rem;
            color: #f0ebff;
            letter-spacing: -0.3px;
        }
        .album-info .song-count {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 400;
            display: block;
            margin-top: 2px;
        }

        /* ===== SONG ITEMS ===== */
        .song-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.5rem 1rem 0.5rem 1.2rem;
            margin: 4px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 400;
            font-size: 0.8rem;
            position: relative;
            border: 1px solid transparent;
        }
        .song-item i {
            width: 20px;
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .song-item .song-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }
        .song-item .song-index {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.15);
            font-weight: 400;
            min-width: 18px;
            text-align: right;
        }
        .song-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 217, 61, 0.05);
            transform: translateX(4px);
            color: rgba(255, 255, 255, 0.8);
        }
        .song-item.playing {
            background: rgba(255, 107, 107, 0.08);
            border-color: rgba(255, 107, 107, 0.15);
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.03);
            color: #ffffff;
        }
        .song-item.playing i {
            color: #ff6b6b;
        }
        .song-item.playing .song-title {
            color: #ffd93d;
        }
        .song-item.playing::before {
            content: '';
            position: absolute;
            left: 0;
            top: 10%;
            height: 80%;
            width: 3px;
            background: linear-gradient(180deg, #ffd93d, #ff6b6b);
            border-radius: 4px;
        }
        .song-item.hidden {
            display: none;
        }

        .no-results {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 1.5rem;
            padding: 1.5rem;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
            border: 1px dashed rgba(255, 217, 61, 0.08);
            display: none;
            margin-top: 0.5rem;
            backdrop-filter: blur(4px);
        }
        .no-results i {
            font-size: 1.2rem;
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.1);
        }

        footer {
            font-size: 0.6rem;
            text-align: center;
            margin-top: 1.5rem;
            color: rgba(255, 255, 255, 0.1);
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 1rem;
        }
        footer i {
            color: rgba(78, 205, 196, 0.3);
            margin: 0 4px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 420px) {
            .player-card {
                padding: 1.2rem;
                border-radius: 2rem;
            }
            .album-card {
                padding: 0.8rem 0.8rem 0.6rem;
                border-radius: 1.2rem;
            }
            .album-cover {
                width: 42px;
                height: 42px;
            }
            .album-cover i {
                font-size: 1rem;
            }
            .album-info .artist-name {
                font-size: 0.85rem;
            }
            .song-item {
                padding: 0.4rem 0.6rem 0.4rem 0.8rem;
                font-size: 0.7rem;
                border-radius: 8px;
            }
            .track-title {
                font-size: 0.95rem;
            }
            .transport-btn {
                padding: 0.5rem 1rem;
                font-size: 0.7rem;
                gap: 6px;
            }
            .transport-row {
                gap: 6px;
            }
            .now-playing-area {
                padding: 0.8rem 1rem;
            }
            .album-art-mini {
                width: 36px;
                height: 36px;
            }
            .playlist-list {
                max-height: 320px;
            }
        }
    </style>
</head>
<body>
    <div class="player-card">
        <div class="player-header">
            <h1><i class="fas fa-compact-disc"></i> Music Player</h1>
            <div class="badge"><i class="fas fa-headphones-simple"></i> album view · colorful</div>
        </div>

        <div class="now-playing-area">
            <div class="now-label"><i class="fas fa-circle-play"></i> sedang diputar</div>
            <div class="track-title">
                <div class="album-art-mini">
                    <i class="fas fa-record-vinyl vinyl-spin" id="discIcon"></i>
                </div>
                <span id="current-title">✨ pilih lagu favoritmu</span>
            </div>
        </div>

        <audio id="audio-player" controls preload="metadata"></audio>

        <div class="transport-row">
            <button id="prev-button" class="transport-btn"><i class="fas fa-backward-step"></i> Sebelumnya</button>
            <button id="next-button" class="transport-btn"><i class="fas fa-forward-step"></i> Selanjutnya</button>
        </div>

        <div class="playlist-section">
            <div class="playlist-header"><i class="fas fa-album"></i> Album &amp; Lagu</div>
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Cari judul atau artis..." autocomplete="off" />
            </div>
            <div class="playlist-list" id="playlist-container"></div>
            <div id="no-results-msg" class="no-results"><i class="fas fa-compact-disc"></i> Lagu tidak ditemukan, coba kata kunci lain</div>
        </div>
        <footer><i class="fas fa-head-side-headphones"></i> gradient vibes · hi-fi player</footer>
    </div>

    <script>
        (function() {
            const songData = [{
                artist: "Ariana Grande",
                title: "Position",
                src: "assets/ariana-grande-positions.mp3"
            }, {
                artist: "Hindia",
                title: "Membasuh",
                src: "assets/hindia-membasuh.mp3"
            }, {
                artist: "Armada",
                title: "Mau Dibawa Kemana",
                src: "assets/mau-dibawa-kemana-armada.mp3"
            }, {
                artist: "Kahitna",
                title: "Titik Nadir",
                src: "assets/KAHITNA-Titik Nadir.mp3"
            }, {
                artist: "Kahitna",
                title: "Mantan Terindah",
                src: "assets/KAHITNA-MANTAN TERINDAH.mp3"
            }, {
                artist: "Marcell",
                title: "Firasat",
                src: "assets/MARCELL-Firasat.mp3"
            }, {
                artist: "Acha & Irwansyah",
                title: "My Heart",
                src: "assets/ACHA SEPTRIASA - IRWANSYAH-My Heart.mp3"
            }, {
                artist: "Hello",
                title: "Ular Berbisa",
                src: "assets/Hello - Ular Berbisa.mp3"
            }, {
                artist: "Rossa",
                title: "Tak Sanggup Lagi",
                src: "assets/Rossa - Tak Sanggup Lagi.mp3"
            }, {
                artist: "Raim Laode",
                title: "Bersenja Gurau",
                src: "assets/Bersenja Gurau - Raim Laode.mp3"
            }, {
                artist: "Sheila On 7",
                title: "Kita",
                src: "assets/Sheila On 7 - Kita.mp3"
            }, {
                artist: "Raim Laode",
                title: "Iqro'",
                src: "assets/Raim Laode - Iqro'.mp3"
            }, {
                artist: "Sheila On 7",
                title: "Dan",
                src: "assets/Sheila On 7 - Dan.mp3"
            }, {
                artist: "Sheila On 7",
                title: "Itu Aku",
                src: "assets/Sheila On 7 - Itu Aku.mp3"
            }, {
                artist: "NUCA",
                title: "MASA INI, NANTI, DAN MASA INDAH LAINNYA",
                src: "assets/NUCA - MASA INI, NANTI, DAN MASA INDAH LAINNYA.mp3"
            }, {
                artist: "Astrid",
                title: "Terpukau",
                src: "assets/Astrid - Terpukau.mp3"
            }, {
                artist: "Pamungkas",
                title: "Berapa Kali Kita Akan Saling Memaafkan",
                src: "assets/Pamungkas - Berapa Kali Kita Akan Saling Memaafkan.mp3"
            }, {
                artist: "Nadhif Basalamah",
                title: "kota ini tak sama tanpamu",
                src: "assets/Nadhif Basalamah - kota ini tak sama tanpamu.mp3"
            }, {
                artist: "Nadhif Basalamah",
                title: "bergema sampai selamanya",
                src: "assets/Nadhif Basalamah - bergema sampai selamanya.mp3"
            }, {
                artist: "ANDMESH",
                title: "ANUGERAH TERINDAH",
                src: "assets/ANDMESH - ANUGERAH TERINDAH.mp3"
            }];

            const player = document.getElementById('audio-player');
            const titleSpan = document.getElementById('current-title');
            const nextBtn = document.getElementById('next-button');
            const prevBtn = document.getElementById('prev-button');
            const searchInput = document.getElementById('search-input');
            const noResults = document.getElementById('no-results-msg');
            const discIcon = document.getElementById('discIcon');
            const container = document.getElementById('playlist-container');

            const groups = {};
            songData.forEach(song => {
                if (!groups[song.artist]) groups[song.artist] = [];
                groups[song.artist].push(song);
            });
            const sortedArtists = Object.keys(groups).sort((a, b) => a.localeCompare(b));

            let allSongItems = [];
            const artistColors = [
                'linear-gradient(135deg, #ff6b6b, #ee5a24)',
                'linear-gradient(135deg, #4ecdc4, #44bd9e)',
                'linear-gradient(135deg, #ffd93d, #f9a825)',
                'linear-gradient(135deg, #6c5ce7, #a29bfe)',
                'linear-gradient(135deg, #fd79a8, #e84393)',
                'linear-gradient(135deg, #00b894, #00cec9)',
                'linear-gradient(135deg, #fdcb6e, #f39c12)',
                'linear-gradient(135deg, #e17055, #d63031)',
            ];

            function renderPlaylist() {
                container.innerHTML = '';
                allSongItems = [];

                sortedArtists.forEach((artist, idx) => {
                    const songs = groups[artist];
                    const colorIdx = idx % artistColors.length;
                    const coverColor = artistColors[colorIdx];

                    const albumCard = document.createElement('div');
                    albumCard.className = 'album-card';
                    albumCard.dataset.artist = artist;

                    const header = document.createElement('div');
                    header.className = 'album-header';
                    header.innerHTML = `
                        <div class="album-cover" style="background: ${coverColor};">
                            <i class="fas fa-compact-disc"></i>
                            <span class="cover-badge"><i class="fas fa-music" style="font-size:0.4rem;"></i></span>
                        </div>
                        <div class="album-info">
                            <span class="artist-name">${artist}</span>
                            <span class="song-count">${songs.length} lagu</span>
                        </div>
                    `;
                    albumCard.appendChild(header);

                    songs.forEach((song, songIdx) => {
                        const item = document.createElement('div');
                        item.className = 'song-item';
                        item.dataset.artist = song.artist;
                        item.dataset.title = song.title;
                        item.dataset.src = song.src;
                        item.innerHTML = `
                            <i class="fas fa-music"></i>
                            <span class="song-title">${song.title}</span>
                            <span class="song-index">${String(songIdx + 1).padStart(2, '0')}</span>
                        `;
                        item.addEventListener('click', () => {
                            const idx = allSongItems.findIndex(s => s.element === item);
                            if (idx !== -1) playTrack(idx);
                        });
                        albumCard.appendChild(item);

                        allSongItems.push({
                            element: item,
                            artist: song.artist,
                            title: song.title,
                            src: song.src,
                            groupKey: artist
                        });
                    });

                    container.appendChild(albumCard);
                });
            }

            renderPlaylist();

            let currentIdx = -1;
            let activeItem = null;

            function setDiscSpin(playing) {
                if (playing) discIcon.classList.add('vinyl-spin');
                else discIcon.classList.remove('vinyl-spin');
            }

            player.addEventListener('play', () => setDiscSpin(true));
            player.addEventListener('pause', () => setDiscSpin(false));
            player.addEventListener('ended', () => setDiscSpin(false));

            function playTrack(index) {
                if (index < 0 || index >= allSongItems.length) {
                    titleSpan.innerHTML = "🏁 akhir playlist · pilih lagu";
                    player.src = "";
                    if (activeItem) activeItem.classList.remove('playing');
                    activeItem = null;
                    currentIdx = -1;
                    setDiscSpin(false);
                    return;
                }

                const song = allSongItems[index];
                if (song.element.classList.contains('hidden')) {
                    resetSearch();
                }

                if (activeItem) activeItem.classList.remove('playing');
                song.element.classList.add('playing');
                activeItem = song.element;
                currentIdx = index;
                titleSpan.innerHTML = `${song.artist} — ${song.title}`;
                player.src = song.src;
                player.load();
                player.play().catch(e => {
                    console.warn("autoplay ditolak", e);
                    titleSpan.innerHTML = `${song.artist} — ${song.title} (klik play)`;
                    setDiscSpin(false);
                });

                const containerRect = container.getBoundingClientRect();
                const itemRect = song.element.getBoundingClientRect();
                if (itemRect.bottom > containerRect.bottom || itemRect.top < containerRect.top) {
                    song.element.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                }
            }

            function nextTrack() {
                if (currentIdx === -1) {
                    if (allSongItems.length) playTrack(0);
                } else {
                    let next = currentIdx + 1;
                    if (next >= allSongItems.length) next = 0;
                    playTrack(next);
                }
            }

            function prevTrack() {
                if (currentIdx === -1) {
                    if (allSongItems.length) playTrack(allSongItems.length - 1);
                } else {
                    let prev = currentIdx - 1;
                    if (prev < 0) prev = allSongItems.length - 1;
                    playTrack(prev);
                }
            }

            nextBtn.addEventListener('click', nextTrack);
            prevBtn.addEventListener('click', prevTrack);
            player.addEventListener('ended', () => {
                if (currentIdx !== -1) nextTrack();
            });

            function filterSongs() {
                const keyword = searchInput.value.trim().toLowerCase();
                let anyVisible = false;

                const albumCards = container.querySelectorAll('.album-card');
                albumCards.forEach(card => {
                    const items = card.querySelectorAll('.song-item');
                    let groupHasVisible = false;

                    items.forEach(item => {
                        const artist = item.dataset.artist.toLowerCase();
                        const title = item.dataset.title.toLowerCase();
                        const match = keyword === '' || artist.includes(keyword) || title.includes(keyword);
                        if (match) {
                            item.classList.remove('hidden');
                            groupHasVisible = true;
                            anyVisible = true;
                        } else {
                            item.classList.add('hidden');
                        }
                    });

                    if (groupHasVisible) {
                        card.classList.remove('hidden-group');
                    } else {
                        card.classList.add('hidden-group');
                    }
                });

                noResults.style.display = (anyVisible || keyword === '') ? 'none' : 'flex';
                if (keyword === '') {
                    noResults.style.display = 'none';
                }
            }

            function resetSearch() {
                if (searchInput.value !== '') {
                    searchInput.value = '';
                    filterSongs();
                } else {
                    container.querySelectorAll('.song-item').forEach(el => el.classList.remove('hidden'));
                    container.querySelectorAll('.album-card').forEach(el => el.classList.remove('hidden-group'));
                    noResults.style.display = 'none';
                }
            }

            searchInput.addEventListener('input', filterSongs);
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') resetSearch();
            });

            player.addEventListener('error', () => {
                let errMsg = "Gagal memuat file. Pastikan folder 'assets' berisi semua MP3.";
                titleSpan.innerHTML = `⚠️ ${errMsg}`;
                if (activeItem) activeItem.classList.remove('playing');
                activeItem = null;
                currentIdx = -1;
                setDiscSpin(false);
            });

            resetSearch();
            player.src = "";
        })();
    </script>
</body>
</html>
